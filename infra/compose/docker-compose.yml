# =============================================================================
# ReqAtlas 本地 / 私有试点编排  —— 【未经验证】
# -----------------------------------------------------------------------------
# 本机（Windows）没有 Docker，产品负责人明确 M0/M1 阶段先不用 Docker。
# 本文件是 M1-02 的后续骨架，未经任何实际运行验证，当前不作为任何验证步骤的前置。
# 依赖服务：PostgreSQL 16 + pgvector、Redis 7、MinIO、Keycloak、ClamAV。
# =============================================================================

name: reqatlas

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reqatlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reqatlas}
      POSTGRES_USER: ${POSTGRES_USER:-reqatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reqatlas_dev_only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-reqatlas} -d ${POSTGRES_DB:-reqatlas}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: reqatlas-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: reqatlas-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-reqatlas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-reqatlas_dev_only}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: reqatlas-keycloak
    restart: unless-stopped
    command: ['start-dev', '--http-port=8080']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  clamav:
    image: clamav/clamav:stable
    container_name: reqatlas-clamav
    restart: unless-stopped
    ports:
      - '${CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
